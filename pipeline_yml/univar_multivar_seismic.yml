# Constants
constants:
  univar_script_path: "/mnt/vm-shared-storage/biomarker-tracing/python_main_cell_type_spec_method/univar_association_testing_auto-script.py"
  enet_script_path: "/mnt/vm-shared-storage/biomarker-tracing/python_main_cell_type_spec_method/elastic_kfold_ver2_auto-script.py"
  rf_script_path: "/mnt/vm-shared-storage/biomarker-tracing/python_main_cell_type_spec_method/tree_based_methods_auto-script.py"
  stab_sele_script_path: "/mnt/vm-shared-storage/biomarker-tracing/python_main_cell_type_spec_method/stability_analyses_auto-script.py"


# General inputs
inputs:
  atlas_smal_path: "/mnt/vm-shared-storage/Atlas_seismic/seismic_gnpc_AD_specificity.tsv"
  atlas_path: "/mnt/vm-shared-storage/Atlas_seismic/seismic_gnpc_AD_specificity.tsv"
  save_path: "/mnt/vm-shared-storage/results"
  save_path_suffix: "seismic_GNPC_AD_abs0"
  disease_prot_dir: "/mnt/vm-shared-storage/plasma_proteome_gnpc/"
  disease_name:
    - AD
  disease_type: "incident"
  popu_type: "all"


# Univariate regression specific params
univariate:
  covar_df: "None"
  covar_gini: 0
  abs_hr: 0
  output_label: "z_score"
  ztransform_type: -1

# Transition
univar_to_multivar:
  column_to_choose: "fdr_one_side_predictor"
  thres: 0.05


# ElasticNet
elasticnet_kfold:
  run: 1    # If run set to 1, then run elasticnet_kfold
  num_alpha: 100
  num_folds: 10
  gene_weight: 0
  abs_hr: 0
  output_label: "z_score"
  ztransform_type: -1
  pos_coef: 0


# Random forest
random_forest:
  run: 1
  param_search: 1
  num_trees: 1000
  min_samples_split: 10
  min_samples_leaf: 2
  max_samples: 0.7

  kfold_n: 5
  n_permute_repeat: 30
  abs_hr: 0
  output_label: "z_score"
  ztransform_type: -1


# Stability selection
stability_selection:
  run: 1
  samp_method: "subsampling_diff_size"
  optim_alpha_mode: "kneedle"
  thres: 0.6
  abs_hr: 0
  output_label: "z_score"
  ztransform_type: -1
  
